[versions]
agp = "8.13.2"
kotlin = "2.2.20"
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.12.01"
coroutines = "1.9.0"
junit = "4.13.2"
# Bundled Tor daemon (native tor + TorService), actively maintained by the
# Guardian Project. 0.4.9.6 is the newest release whose AAR metadata allows
# compileSdk 36: every later 0.4.9.x build requires compileSdk 37, and this
# project builds against 36 (the maximum AGP 8.13 supports). minSdk 24, so it
# is fine for this app's 26. Pulls jtorctl for the Tor control connection.
torAndroid = "0.4.9.6"
# QR decoding for the xpub scanner. journeyapps' wrapper around the ZXing core
# decoder; this app embeds its DecoratedBarcodeView directly as a small portrait
# panel on the import screen, so no activity of ours is involved and no
# full-screen capture UI is ever launched. Chosen over CameraX + ML Kit because
# it is Apache-2.0, pulls in no Google Play services (it is the same ZXing engine
# that will decode the animated-QR PSBT frames later), and adds one artifact
# instead of three. com.google.zxing:core comes along transitively.
zxingEmbedded = "4.3.0"
# androidx.biometric for the app lock: the system BiometricPrompt with a device
# -credential fallback (setAllowedAuthenticators(BIOMETRIC_WEAK or
# DEVICE_CREDENTIAL)). AOSP, no Google Play services, no ML Kit; it is the
# support-library prompt that wraps the platform one and normalises the API
# across 26..36. This is the only new dependency the app-lock phase adds.
biometric = "1.1.0"
# BC-UR (Uniform Resources) for the SeedSigner-native import: the animated
# fountain-code QR frames a signer shows when exporting its account. hummingbird
# is Sparrow's implementation of the UR spec (a direct port of URKit), Apache-2.0,
# plain Java with no Android dependency at all — so the whole decoder runs on the
# JVM in unit tests — and its only transitive dependency is co.nstant.in:cbor.
# Used by the "add signing device" screen (crypto/UrAccountImport.kt), not by the
# text-QR watch-only path, which needs no UR support.
hummingbird = "1.7.6"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
tor-android = { group = "info.guardianproject", name = "tor-android", version.ref = "torAndroid" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
hummingbird = { group = "com.sparrowwallet", name = "hummingbird", version.ref = "hummingbird" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
